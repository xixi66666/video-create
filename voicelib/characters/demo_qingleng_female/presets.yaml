# 预设表 —— 示例。键名即 SPEC L1-05 要求的 emotion 取值。
character_id: demo_qingleng_female
version: "0.1.0"

notes: |
  emo 使用具名键,不要写成定序数组。各键之和 ≤0.8,剩下的留给音色自带底色。

presets:
  calm:
    rate: 0.95
    emo: {calm: 0.60, melancholic: 0.15}
    intensity: 0.30
    pause_after: 0.35
    reverb: room_small

  intense:
    rate: 1.05
    emo: {angry: 0.55, disgusted: 0.10}
    intensity: 0.80
    pause_after: 0.20
    reverb: room_small

  whisper:
    rate: 0.98
    emo: {sad: 0.45, melancholic: 0.25}
    intensity: 0.25
    pause_after: 0.45
    gain_db: -4
    reverb: close

  surprised:
    rate: 1.08
    emo: {surprised: 0.50, afraid: 0.15}
    intensity: 0.65
    pause_after: 0.15
