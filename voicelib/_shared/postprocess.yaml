# 统一混音链参数(SPEC §6)
# 禁止在项目内覆写。改这里 = 全库听感统一变化,属破坏性变更,须升 SPEC 次版本。

version: 0.1.0
master:
  sample_rate: 48000
  bit_depth: 24
  loudness_lufs: -14.0
  true_peak_db: -1.0

voice_chain:
  highpass:
    hz: 80
    poles: 2
  eq:
    - { type: peak, hz: 3000, gain_db: 2.0, q: 0.9 }
    - { type: peak, hz: 250, gain_db: -1.5, q: 1.2 }
  deesser:
    low_hz: 6000
    high_hz: 8000
    reduction_db: -3.0
  compressor:
    ratio: 3.0
    threshold_db: -18.0
    attack_ms: 5
    release_ms: 80
    knee_db: 6
  reverb:
    type: plate
    decay_s: 1.0
    wet_db: -18.0
  limiter:
    ceiling_dbtp: -1.0

bgm:
  sidechain:
    enabled: true
    depth_db: -12.0        # 必须 ≥10dB(L0-07)
    attack_ms: 15
    release_ms: 250
  base_gain_db: -6.0       # 人声缺席段的基准,非最终音量

ambience:
  enabled: true
  gain_db: -20.0           # ±3(L4-03)
  stereo_width: 0.8        # 人声居中,BGM/环境声铺开(L4-04)

rules_ref:
  - L0-01
  - L0-02
  - L0-07
  - L4-01
  - L4-02
  - L4-03
  - L4-05
  - L4-06
