# take 记录模板 —— 挑条留痕
#
# 规则:SPEC §4.1 / L2-05(人工)、L2-08(seed 可复现)、L0-10(≥3 条)
# 为什么必须记:三个月后要复现某一句,只有这张表能告诉你当时为什么选它。
#
# 关键纪律(L2-08):
#   同一 beat 的多个 take 必须固定 seed。不固定 seed 时,3 条之间的差异
#   只是采样噪声,不构成"差异化 take",等于没做多 take。

scene_id: S01
character_id: <>
ref_sha1: <>                 # 参考音频指纹(L2-09),换参考音频必须换这一行
model: <>                    # 例:index_tts25
preset: calm
seed_base: 4242              # 固定基线;单 beat 偏移量写在条目里

takes:

  - beat: S01-B01
    chosen: 2
    candidates: 3
    seeds: [4242, 4243, 4244]
    params:
      rate: 0.95
      emo: {calm: 0.60, melancholic: 0.15}
      pause_after: 0.50
    rejected:
      1: 句尾截断
      3: 气口错位,切在词中
    reason: 情绪命中           # 枚举见下
    reviewer: 人工
    reviewed_at: "2026-11-10"

  - beat: S01-B05
    chosen: 1
    candidates: 3
    seeds: [4242, 4243, 4244]
    params:
      rate: 1.05
      emo: {angry: 0.55, disgusted: 0.10}
      pause_after: 0.20
    rejected:
      2: 起音太软,不够"顶"
      3: 破折号处拖长,失去了顿挫
    reason: 情绪命中
    reviewer: 人工
    reviewed_at: "2026-11-10"

# reason 枚举(按优先级,前一条一票否决):
#   1 无读音错误   2 情绪命中   3 气口自然   4 音色一致   5 起收干净
