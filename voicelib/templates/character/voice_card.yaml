# 角色声卡 —— 空模板
#
# 用法:复制到 voicelib/characters/<character_id>/voice_card.yaml,逐项填。
# 契约:schema/voice_card.schema.json
# 注意:本文件是骨架,`<>` 全部要替换;未填完不要去登记 registry。
#
# 建角色的真实顺序(别倒过来):
#   1. 先定声源(真人/授权音色/设计音色)→ 拿到授权
#   2. 录 10–14 秒干声 ×3(calm/intense/whisper)
#   3. 试听定档 → 填本卡 → 填 presets → 登记 registry → 更新 catalog

character_id: <>             # 小写+下划线,^[a-z][a-z0-9_]{2,31}$,永不复用
display_name: <>
version: "0.1.0"             # 改音色/参考音频 → 升 MAJOR
status: draft                # draft | active | retired

profile:
  gender: <>                 # male | female | neutral
  age_range: "<18-22>"
  timbre_tags: []            # 2–6 个短标签,用于选角检索。例:[清冷, 偏低, 微沙]
  archetype: <>              # 戏路,如 侠女 / 少年 / 老者 / 反派
  register: <>               # 音区,如 中低音区
  notes: <>

voice:
  rate_baseline: 0.95        # 库内语义:>1 更快、<1 更慢。别填供应商的 speed
  pitch_baseline_st: 0.0     # 相对中性声的半音偏移
  breathiness: 0.3           # 0–1

source:
  type: commissioned_cv      # commissioned_cv | self_recorded | licensed_api | designed
  license_ref: licenses/<character_id>.md   # 必须存在,否则构建失败(铁律 4)
  valid_until: "<2029-11-30>"               # 务必加引号,否则 YAML 解析成日期对象
  refs:
    # 10–14 秒,硬上限 15 秒;超出会被上游静默截断
    # 必须是无 BGM、无混响、单人、44.1k/24bit 的干声
    calm: refs/calm.wav
    intense: refs/intense.wav
    whisper: refs/whisper.wav

providers:
  # key 必须在 _shared/providers.yaml 中登记过
  # 只写该供应商需要的东西;端点、路径一律走环境变量(L3-07)
  index_tts25:
    ref: refs/calm.wav
    attn_backend: sdpa
    out_rate: 22050
  # doubao:
  #   voice_id: <>

fallback_order: [index_tts25]   # 必须都能在 providers 里找到

bench:
  lines: bench/lines.txt        # 10 句回归测试,换模型/换参考必跑
  last_score: null              # 人工 1–5 分,低于 4 不许上线

notes: |
  <这个角色的表演要点:情绪内收?爆发靠气息?哪些字容易读错?>
