# 预设表 —— 空模板
#
# 用法:与 voice_card.yaml 同目录。键名即脚本里可写的 emotion 值(L1-05)。
# 契约:schema/presets.schema.json
#
# 设计要点:
#   - emo 用「具名键」,不要写定序数组(8 维向量由适配器映射,避免写错位)
#   - 各键之和 ≤ 0.8,剩下留给音色自带的情绪底色(L2-02)
#   - rate 是库内语义:>1 更快。IndexTTS 的 speed 是反的,由适配器取倒数
#   - pause_after 必须有差异,不能每档都一样(L2-04)

character_id: <>
version: "0.1.0"

presets:

  # 默认档。大多数旁白/叙述走这里
  calm:
    rate: 0.95
    emo: {calm: 0.60, melancholic: 0.15}
    intensity: 0.30
    pause_after: 0.35
    reverb: room_small

  # 爆发档。注意:激烈不等于提高音量,而是收紧气息、加快起音
  intense:
    rate: 1.05
    emo: {angry: 0.55, disgusted: 0.10}
    intensity: 0.80
    pause_after: 0.20
    reverb: room_small

  # 气声档。用于贴耳、秘密、濒死等场景
  whisper:
    rate: 0.98
    emo: {sad: 0.45, melancholic: 0.25}
    intensity: 0.25
    pause_after: 0.45
    gain_db: -4
    reverb: close

  # 可选:受惊档
  # surprised:
  #   rate: 1.08
  #   emo: {surprised: 0.50, afraid: 0.15}
  #   intensity: 0.65
  #   pause_after: 0.15

# 允许的情绪键(固定枚举,来自供应商的 8 维定义):
#   happy angry sad afraid disgusted melancholic surprised calm
