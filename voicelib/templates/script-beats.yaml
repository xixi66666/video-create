# 可表演脚本模板 —— 配音的唯一输入
#
# 用法:复制本文件到项目的 script/ 下,改名 <scene_id>.beats.yaml,只改内容不改结构。
# 契约:schema/beats.schema.json;规则:SPEC §3(L1-01 ~ L1-06)
#
# 三条最容易犯的错:
#   1. 写成一整段旁白 —— 必须是逐句 beat
#   2. 单句超 18 字 —— 中文一口气读不完,情绪必被压平
#   3. 数字写阿拉伯 —— TTS 会读错;必须写成汉字(第3集 → 第三集)

scene_id: S01
pace_profile: drama          # drama 3.2–3.8 字/秒;explainer 4.0–4.4

character_refs:              # 须已在 registry.json 登记
  - { character_id: demo_qingleng_female, version: "0.1", role: lead }
  - { character_id: narrator, version: "0.1", role: narrator }

beats:

  # ── 开篇:短句 + 长停顿,先立氛围
  - id: S01-B01
    speaker: narrator
    text: "雨夜。断桥。一盏将熄的灯。"
    emotion: calm
    intensity: 0.25
    pause_after: 0.50
    block: S01-K01
    notes: 三顿,每顿下沉。不要连读

  # ── 第一句人声:气声,给"贴耳"的距离感
  - id: S01-B02
    speaker: demo_qingleng_female
    text: "别出声……它还在上面。"
    emotion: whisper
    intensity: 0.30
    pause_after: 0.45
    block: S01-K01
    notes: 气声。省略号处必须留气口

  - id: S01-B03
    speaker: demo_qingleng_female
    text: "你听得见吗?"
    emotion: calm
    intensity: 0.35
    pause_after: 0.30
    block: S01-K02
    notes: 尾音上扬但不急切

  - id: S01-B04
    speaker: narrator
    text: "她握紧了刀柄。"
    emotion: calm
    intensity: 0.40
    pause_after: 0.35
    block: S01-K02

  # ── 情绪最高点:破折号顿住,后接重音
  - id: S01-B05
    speaker: demo_qingleng_female
    text: "退开——别碰那口井!"
    emotion: intense
    intensity: 0.85
    pause_after: 0.20
    block: S01-K03
    notes: 破折号要顿住,不要拖长音

  # ── 收尾:信息落点,停顿最长,留给画面
  - id: S01-B06
    speaker: narrator
    text: "三十七年前,这里埋过一个人。"
    emotion: calm
    intensity: 0.30
    pause_after: 0.60
    block: S01-K03
    notes: 数字读「三十七」;句尾下沉

# ── 写作检查(对应 L1) ────────────────────────────────────
# [ ] 每句去标点 ≤18 字
# [ ] 没有 >40 字的 beat,没有 ≥3 个句号的 beat
# [ ] 标点原样保留(,。?!……——、)
# [ ] 数字、单位全部写成汉字
# [ ] emotion 用的是该角色 presets.yaml 里有的键
# [ ] pause_after 有变化,不是全部同值
# [ ] block 内合计 ≤40 字
