# 项目配音声明模板
#
# 用法:项目根目录放一份 voice.yaml,声明"这个项目用声库里的谁、什么档、交付什么"。
# 原则:只引用,不复制。改声库 = 全项目生效;要锁死就写 version。
# 校验:schema/voice_card.schema.json(角色)+ schema/beats.schema.json(脚本)

project: example_ep01
spec_version: "v0.2.1"

# ── 档位:先草声跑流程,冻结后升终声(L3-09 / L5-08)
stage: draft                 # draft = 草声;final = 终声
delivery: false              # draft 阶段必须为 false,禁止交付

# ── 用了哪些角色
characters:
  - character_id: demo_qingleng_female
    version: "0.1"           # 锁 MAJOR:声库升 0.2 时本项目不自动跟随
    preset_base: calm        # 该角色的默认档
    refs: calm               # 用哪条参考音频(calm/intense/whisper)
  - character_id: narrator
    version: "0.1"
    preset_base: calm

# ── 表演设定
performance:
  pace_profile: drama        # drama 3.2–3.8 字/秒
  takes_per_beat: 3          # L0-10 下限,不许低于 3
  seed_strategy: fixed       # fixed = 可复现;L2-08
  breath_every: 3            # 每 N 个 beat 插一次气口,L2-03

# ── 合成与混音
synthesis:
  provider_order: [index_tts25, doubao]   # 与角色的 fallback_order 取交集
  master_sample_rate: 48000
  postprocess: _shared/postprocess.yaml   # 只许引用,不许覆写(L4-01)

# ── 混音素材(机器路径走环境变量,不写死在这里 —— L3-07)
audio:
  bgm: assets/bgm/main_theme.wav
  ambience: assets/ambience/rain_light.wav
  bgm_duck_db: -12            # ≥10 才合格(L0-07)

# ── 交付要求
deliverables:
  - master_wav                # 48k/24bit
  - subtitles_srt             # 时间轴来自实测采样帧(L5-02)
  - manifest_json             # 句数 = beat 数,含哈希(L0-11)

# ── 验收
acceptance:
  loudness_lufs: "-14 ± 1"
  silence_ratio_max: 0.08
  sync_tolerance_s: 0.2
  human_review: required      # 人工签收项见 docs/DELIVERY-CHECKLIST.md

# ── 备注
notes: |
  本项目为模板示例。实际使用时:
  - stage=draft 时不得交付
  - 升 final 前画面必须冻结
  - 换角色/换参考音频 = 整集重录,需显式确认
